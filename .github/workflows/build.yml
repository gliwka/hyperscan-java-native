name: build
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
jobs:
  build-native:
    name: Build native libs
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-14-large
            shell: bash
            platform: macosx-x86_64
            jdkArch: x64
          - os: macos
            runner: macos-14-xlarge
            shell: bash
            platform: macosx-arm64
            jdkArch: aarch64
          - os: linux
            runner: ubuntu-24.04
            shell: bash
            platform: linux-x86_64
          - os: linux
            runner: ubuntu-24.04-arm
            shell: bash
            platform: linux-arm64
    env:
      DETECTED_PLATFORM: ${{ matrix.platform }}
      STAGING: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        if: matrix.os == 'macos'
        with:
          distribution: 'temurin'
          java-version: '21'
          architecture: ${{ matrix.jdkArch }}
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        if: matrix.os == 'macos'
        with:
          xcode-version: 16.2
      - name: Build native binaries
        if: matrix.os == 'macos'
        run: ./build.sh
      - name: Build native binaries in centos container
        if: matrix.os == 'linux'
        uses: docker://ghcr.io/gliwka/centos7-toolchain:main@sha256:e6cf17223408bb4d1314be547d74b23d04bcf6480d2fe23822fb672a52775f76
        with:
          args: '"./build.sh"'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-result-${{ matrix.platform }}
          path: target/staging-deploy
  publish:
    if: contains(github.ref, 'refs/tags/v')
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: target/staging-deploy
          merge-multiple: true
      - name: Merge multiple local repositories
        run: ./merge-artifacts.sh
      - uses: jreleaser/release-action@90ac653bb9c79d11179e65d81499f3f34527dcd5
        with:
          arguments: deploy --debug
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.SIGN_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.SIGN_KEY_PASS }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: releaser
          path: |
            target/staging-deploy
            out
